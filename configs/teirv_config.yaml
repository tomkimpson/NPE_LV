# TEIRV NPE Unified Configuration
# This file consolidates all TEIRV parameters for data generation, training, and inference

# Data generation and simulation parameters
data:
  # Data source configuration
  # Option 1: Use existing data file
  #   source: "data/training_50k_v1.pkl"
  # Option 2: Generate new data
  #   source: "generate"
  #   output_name: "training_50k_v2.pkl"  # Name for the generated dataset

  source: "data/training_200k_20251022.pkl"      # "generate" or path to existing .pkl file
  output_name: "NONE"  # Name for generated data (with corrected beta scaling)

  # Training data generation (only used if source="generate")
  generation:
    n_samples: 200000         # Number of training samples
    batch_size: 500           # Batch size for generation
    seed: 42                  # Random seed for reproducibility
    success_rate_threshold: 0.95  # Minimum simulation success rate
    max_attempts: 3           # Max attempts for batch generation
    
  # Simulation parameters
  simulation:
    t_max: 10.0               # Maximum simulation time (days)
    dt: 1.0                   # Time step for observations (days)
    max_steps: 100000         # Maximum Gillespie steps
    extinction_threshold: 1.0e-6  # Threshold for extinction
    
  # Observation model
  observation:
    type: rt_pcr
    noise_std: 1.0            # Observation noise standard deviation
    detection_limit: -0.65    # RT-PCR detection limit (log10)
    use_observations_only: true  # Only use observation data (not full states)
    
  # Clinical data processing
  clinical:
    # Data paths
    paths:
      clinical_data_dir: data/clinical
      
    # Patient filtering criteria
    patient_filtering:
      min_detections: 5         # Minimum number of detectable viral loads
      min_peak_viral_load: 2.0  # Minimum peak viral load (log10)
      max_missing_timepoints: 5 # Maximum missing consecutive timepoints
      
    # Data quality thresholds
    quality_control:
      detection_rate_threshold: 0.8  # Minimum detection rate
      outlier_threshold: 3.0         # Standard deviations for outlier detection
      
    # Data preprocessing
    preprocessing:
      log_transform: true            # Apply log10 transformation
      standardize: false             # Whether to standardize data
      fill_missing: true             # Fill missing values
      missing_value_strategy: interpolate  # How to handle missing data
      
    # Available patient IDs (from JSFGermano2024)
    available_patients:
      - "432192"
      - "443108" 
      - "444332"
      - "444391"
      - "445602"
      - "451152"

# TEIRV model configuration
model:
  n_dim: 6  # Number of parameters (beta, pi, delta, phi, rho, V0)
  
  # Prior parameters
  priors:
    beta:
      type: uniform
      low: 0.0
      high: 20.0
    pi:
      type: uniform  
      low: 200.0
      high: 600.0
    delta:
      type: uniform
      low: 1.0
      high: 11.0
    phi:
      type: uniform
      low: 0.0
      high: 15.0
    rho:
      type: uniform
      low: 0.0
      high: 1.0
    V0:
      type: log_uniform
      low: 1.0
      high: 148.0
      
  # Initial conditions
  # NOTE: These values are currently NOT used by the code.
  # Initial conditions and fixed parameters are hardcoded in src/teirv_utils.py:
  #   - T0 = 8e7, E0 = 1.0, I0 = 0.0, R0 = 0.0 (see get_teirv_initial_conditions())
  #   - k = 4.0, c = 10.0 (see get_teirv_fixed_parameters())
  # The values below are commented out to avoid confusion:
  initial_conditions:
    # T0: 2.0e8      # Initial target cells (UNUSED - actual: 8e7)
    # E0: 0.0        # Initial eclipsed cells (UNUSED - actual: 1.0)
    # I0: 0.0        # Initial infectious cells (correct but unused)
    # R0: 0.0        # Initial refractory cells (correct but unused)
    # c: 23.0        # Viral clearance rate (UNUSED - actual: 10.0)
    # k: 4.0         # Progression rate (correct but unused)

# Neural network architecture
network:
  hidden_features: 2048     # Number of hidden units (INCREASED for aggressive training)
  num_transforms: 20        # Number of coupling transforms (INCREASED)
  num_bins: 16             # Number of bins for spline transforms (INCREASED)
  batch_norm: true         # Use batch normalization

# Training configuration
training:
  batch_size: 512          # Training batch size
  learning_rate: 2.0e-4    # Initial learning rate (REDUCED for more stable convergence)
  max_num_epochs: 1000     # Maximum training epochs
  validation_fraction: 0.10 # Fraction of data for validation (REDUCED - more data for training)
  stop_after_epochs: 300   # Early stopping patience (INCREASED - allow much longer training)
  
  # Optimizer settings
  optimizer:
    type: adam
    weight_decay: 1.0e-5
    
  # Learning rate scheduler
  scheduler:
    type: reduce_on_plateau
    factor: 0.8            # More gradual LR reduction (INCREASED from 0.5)
    patience: 30           # Wait longer before reducing LR (INCREASED from 10)
    min_lr: 1.0e-6
    
  # Logging
  logging:
    log_interval: 10       # Log every N epochs
    use_tensorboard: true  # Enable tensorboard logging
    # Note: log directory will be created automatically within each run directory
    
  # Model saving
  saving:
    save_best_model: true
    checkpoint_every: 50   # Save checkpoint every N epochs

# Inference parameters
inference:
  n_samples: 20000         # Posterior samples for inference
  min_detections: 5        # Minimum detections for patient inclusion
  min_peak_viral_load: 2.0 # Minimum peak viral load

# System configuration
system:
  device: cuda             # Use 'cuda' if GPU available, 'cpu' otherwise
  
  # Parallel processing
  parallel:
    use_multiprocessing: false  # Enable multiprocessing
    n_workers: 4               # Number of worker processes
    
  # Progress tracking
  progress:
    show_progress_bar: true    # Show tqdm progress bar
    log_every_n_batches: 10   # Log progress every N batches

# SLURM configuration
slurm:
  job_name: teirv_production
  # Note: SLURM logs will be created automatically within each run's logs/slurm/ directory
  export: ALL
  gres: gpu:1
  time: "36:00:00"
  mem: 32G
  cpus_per_task: 4