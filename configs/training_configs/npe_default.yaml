# Default NPE Training Configuration

# Network architecture
network:
  hidden_features: 256      # Number of hidden units
  num_transforms: 8         # Number of coupling transforms
  num_bins: 10             # Number of bins for spline transforms
  batch_norm: true         # Use batch normalization

# Training parameters
training:
  batch_size: 128          # Training batch size
  learning_rate: 1.0e-3    # Initial learning rate
  max_num_epochs: 100      # Maximum training epochs
  validation_fraction: 0.2  # Fraction of data for validation
  stop_after_epochs: 20    # Early stopping patience
  
# Optimizer settings
optimizer:
  type: adam
  weight_decay: 1.0e-5
  
# Learning rate scheduler
scheduler:
  type: reduce_on_plateau
  factor: 0.5
  patience: 10
  min_lr: 1.0e-6

# Device settings
device: cpu              # Use 'cuda' if GPU available

# Logging
logging:
  log_interval: 10       # Log every N epochs
  use_tensorboard: true  # Enable tensorboard logging
  summary_writer_dir: results/experiments/training_logs

# Model saving
saving:
  save_best_model: true
  checkpoint_every: 50   # Save checkpoint every N epochs